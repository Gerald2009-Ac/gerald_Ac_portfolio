<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daimon Health Care | Your Health, Our Priority</title>

    <meta name="description"
          content="Discover the services offered by Daimon Health Care and request a medical appointment.">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Website Header -->
    <header>
        <div class="logo">
            <span class="logo-icon">D+</span>

            <div>
                <h2>DAIMON</h2>
                <p>HEALTH CARE</p>
            </div>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#about">About Us</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
            <a href="signup.html">Sign up</a>
            <!-- <a href="login.html">Login</a> -->

            <a href="login.html" class="nav-button">
                Login
            </a>
        </nav>
    </header>

    <main>

        <section id="appointment" class="section appointment-section">

            <p class="eyebrow">PATIENT SERVICES</p>

            <h2>Forget Password</h2>

            <p>
                Fill in the field below to:
            </p>

            <form id="appointment-form">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                        >
                    </div>
                </div>

               <button type="submit" class="button">
                    Finish
                </button>


                <p id="form-message" role="status" aria-live="polite"></p>

            </form>

        </section>

    </main>

    <!-- Website Footer -->
    <footer class="loginfooter">
        <h3>DAIMON HEALTH CARE</h3>

        <p>Your Health, Our Priority.</p>

        <p>
            &copy; <span id="year"></span> Daimon Health Care.
            All rights reserved.
        </p>
    </footer>

    <script src="JavaScript/script.js"></script>

</body>
</html>

        <!-- Appointment Booking Form -->
        <section id="appointment" class="section appointment-section">

            <p class="eyebrow">PATIENT SERVICES</p>

            <h2>Sign up</h2>

            <p>
                Sign up now, in oder to have privilege to book appointment.
            </p>

            <form id="appointment-form">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="name">Full Name *</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number *</label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            autocomplete="tel"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="service">Gender</label>

                        <select id="gender" name="text" required>
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>

                     <div class="form-group">
                        <label for="email">Password</label>

                        <input
                            type="password"
                            id="email"
                            name="password"
                            autocomplete="new-password"
                        >
                    </div>

                     <div class="form-group">
                        <label for="email">Confirm Password</label>

                        <input
                            type="password"
                            id="email"
                            name="password"
                            autocomplete="current-password"
                        >
                    </div>
